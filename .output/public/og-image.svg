<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f6"/>
      <stop offset="1" stop-color="#eef3ee"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#137c7b"/>
      <stop offset="1" stop-color="#0d5959"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#137c7b"/>
      <stop offset="0.7" stop-color="#df5f4f"/>
      <stop offset="1" stop-color="#f0b94e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#137c7b"/>
      <stop offset="0.7" stop-color="#df5f4f"/>
      <stop offset="1" stop-color="#f0b94e"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative orbs (mirrors the hero) -->
  <g filter="url(#blur)" opacity="0.5">
    <circle cx="1080" cy="120" r="190" fill="#137c7b"/>
    <circle cx="980" cy="470" r="150" fill="#f0b94e" opacity="0.7"/>
    <circle cx="1180" cy="560" r="140" fill="#df5f4f" opacity="0.7"/>
  </g>

  <!-- content -->
  <g transform="translate(90, 150)">
    <!-- CE mark -->
    <rect width="96" height="96" rx="22" fill="url(#mark)"/>
    <text x="48" y="49" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="1">CE</text>

    <!-- status pill -->
    <g transform="translate(120, 18)">
      <rect width="320" height="56" rx="28" fill="#ffffff" stroke="#0d5959" stroke-opacity="0.18"/>
      <circle cx="34" cy="28" r="7" fill="#2eb86b"/>
      <text x="58" y="29" font-size="22" font-weight="600" fill="#0d5959" dominant-baseline="central">Available for new front-end work</text>
    </g>

    <!-- name -->
    <text x="0" y="232" font-size="104" font-weight="700" fill="url(#name)" letter-spacing="-3">Chaimel Enjambre</text>

    <!-- role -->
    <text x="0" y="300" font-size="40" font-weight="600" fill="#2b3136">Front-End Developer · Cebu, PH</text>

    <!-- tagline -->
    <text x="0" y="356" font-size="29" font-weight="500" fill="#586069">Clean, fast, responsive websites — WordPress, Nuxt.js &amp; modern front-end tooling.</text>
  </g>

  <!-- accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent)"/>
</svg>
